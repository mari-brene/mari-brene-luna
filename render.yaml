# Deploy da API no Render (render.com) via Blueprint.
# Front-end: publique a pasta web/ no Vercel com VITE_API_URL apontando para esta API.
services:
  - type: web
    name: luna-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-web.txt
    startCommand: uvicorn luna.web.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/saude
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: LUNA_CORS_ORIGINS
        sync: false # ex.: https://luna-web.vercel.app
      - key: SUPABASE_URL
        sync: false # ex.: https://xxxx.supabase.co
      - key: SUPABASE_SECRET_KEY
        sync: false # chave secret (sb_secret_...) — nunca no front-end
      - key: GEMINI_API_KEY
        sync: false # Google AI Studio; ativa a IA quando nenhum comando reconhece a frase
      - key: XAI_API_KEY
        sync: false # opcional: Grok (xAI), usado quando o Gemini estiver sem cota
