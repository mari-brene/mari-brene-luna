# Deploy da API no Render (render.com) via Blueprint.
# Front-end: publique a pasta web/ no Vercel com VITE_API_URL apontando para esta API.
services:
  - type: web
    name: luna-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-web.txt
    startCommand: uvicorn luna.web.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/saude
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: LUNA_CORS_ORIGINS
        sync: false # ex.: https://luna-web.vercel.app
      - key: SUPABASE_URL
        sync: false # ex.: https://xxxx.supabase.co
      - key: SUPABASE_SECRET_KEY
        sync: false # chave secret (sb_secret_...) — nunca no front-end
      - key: GEMINI_API_KEY
        sync: false # Google AI Studio; ativa a IA quando nenhum comando reconhece a frase
      # IA: defina as chaves dos provedores que quiser; os gratuitos são tentados primeiro
      - key: GROQ_API_KEY
        sync: false # opcional, gratuito: console.groq.com
      - key: CEREBRAS_API_KEY
        sync: false # opcional, gratuito: cloud.cerebras.ai
      - key: MISTRAL_API_KEY
        sync: false # opcional, gratuito (modo Free/Experiment): console.mistral.ai
      - key: OPENROUTER_API_KEY
        sync: false # opcional, modelos :free: openrouter.ai
      - key: XAI_API_KEY
        sync: false # opcional, PAGO: Grok (xAI), último da fila
